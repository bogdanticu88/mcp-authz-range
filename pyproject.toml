[project]
name = "mcp-range"
version = "0.1.0"
description = "A local, offline range of real MCP authorization CVEs. Your authorization tests pass; the agent's path doesn't."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # harness is pure standard library: nothing to install

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
range = "cli:main"

[tool.setuptools]
packages = []
py-modules = ["cli", "verdict", "t1_cross_tenant", "t2_t3", "t4_privilege", "fixture", "fixture_control", "http_adapter"]
package-dir = { "" = "harness" }
